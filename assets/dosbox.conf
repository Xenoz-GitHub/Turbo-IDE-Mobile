[dosbox]
machine=vgaonly
memsize=16
captures=capture

[cpu]
core=normal
cputype=auto
cycles=max

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=25

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
disney=true

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[autoexec]
@echo off
# Virtual Layout auto-mount: C: Turbo C++ System, D: User Projects
mount c /data/user/0/com.encryptedcrew.turboc/files/tc -t dir
mount d /data/user/0/com.encryptedcrew.turboc/files/workspace -t dir
c:
set PATH=C:\TC\BIN;%PATH%
d:
cd \
if not exist D:\OUT mkdir D:\OUT
C:\TC\BIN\TC.EXE
