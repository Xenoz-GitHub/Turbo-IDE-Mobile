<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ecMintLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4D0" />
      <stop offset="45%" stop-color="#00D2A4" />
      <stop offset="100%" stop-color="#009E7E" />
    </linearGradient>

    <linearGradient id="ecDeepTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008065" />
      <stop offset="60%" stop-color="#005B48" />
      <stop offset="100%" stop-color="#003D30" />
    </linearGradient>

    <linearGradient id="ecMidTone" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00B890" />
      <stop offset="100%" stop-color="#007F63" />
    </linearGradient>

    <linearGradient id="ecTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA0" />
      <stop offset="50%" stop-color="#00E5B8" />
      <stop offset="100%" stop-color="#00BFA0" />
    </linearGradient>
  </defs>

  <!-- 1. The "EC" Aerodynamic Monogram -->
  <g transform="translate(100, 15)">
    <!-- E - Left Angular Facet (Darker Shadow Spine) -->
    <path d="M 75 155 L 15 155 L 60 75 L 105 35 L 125 35 L 75 115 Z" fill="url(#ecDeepTeal)" />

    <!-- E - Top Bar (Bright Mint Light) -->
    <path d="M 105 35 L 205 35 L 180 75 L 135 75 L 125 35 Z" fill="url(#ecMintLight)" />

    <!-- E - Main Forward Diagonal Body -->
    <path d="M 135 75 L 180 75 L 160 115 L 115 115 L 75 115 L 100 75 Z" fill="url(#ecMidTone)" />

    <!-- C - Upper Hook / Arm -->
    <path d="M 170 95 L 235 95 L 210 135 L 165 135 L 155 115 L 170 95 Z" fill="url(#ecMintLight)" />

    <!-- C - Right Curve Outer Facet -->
    <path d="M 175 95 L 245 95 L 215 145 L 235 145 L 220 175 L 140 175 L 155 145 L 195 145 L 205 125 L 165 125 Z" fill="url(#ecMintLight)" />

    <!-- C - Lower Sweeping Tail (Interlocking under E) -->
    <path d="M 155 145 L 230 145 L 215 175 L 130 175 L 145 145 Z" fill="url(#ecDeepTeal)" />

    <!-- Sharp Bevel Cut Lines -->
    <line x1="105" y1="35" x2="75" y2="115" stroke="#4EFFD9" stroke-width="1.5" opacity="0.8" />
    <line x1="75" y1="115" x2="15" y2="155" stroke="#00352A" stroke-width="1.5" opacity="0.6" />
    <line x1="105" y1="35" x2="205" y2="35" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />
    <line x1="135" y1="75" x2="180" y2="75" stroke="#FFFFFF" stroke-width="1" opacity="0.7" />
    <line x1="175" y1="95" x2="245" y2="95" stroke="#FFFFFF" stroke-width="1" opacity="0.8" />
  </g>

  <!-- 2. "ENCRYPTED CREW" Wordmark -->
  <g transform="translate(250, 240)">
    <text x="0" y="0" text-anchor="middle" fill="url(#ecTextGrad)" font-family="'Share Tech Mono', Arial, sans-serif" font-size="44" font-weight="900" font-style="italic" letter-spacing="6">
      ENCRYPTED
    </text>

    <!-- Subtext —— C R E W —— -->
    <g transform="translate(0, 36)">
      <path d="M -160 0 L -75 0" stroke="url(#ecTextGrad)" stroke-width="2.5" stroke-linecap="round" />
      <text x="0" y="5" text-anchor="middle" fill="#00E5B8" font-family="'Share Tech Mono', monospace, sans-serif" font-size="22" font-weight="900" letter-spacing="12">
        CREW
      </text>
      <path d="M 75 0 L 160 0" stroke="url(#ecTextGrad)" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
