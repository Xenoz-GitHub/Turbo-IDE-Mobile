<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="tcRedGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C41800" />
      <stop offset="50%" stop-color="#E22E04" />
      <stop offset="100%" stop-color="#C41800" />
    </linearGradient>
    <linearGradient id="tcCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8FFFF" />
      <stop offset="35%" stop-color="#00E5E5" />
      <stop offset="100%" stop-color="#009999" />
    </linearGradient>
  </defs>

  <!-- Base Dark Blue Background -->
  <rect width="64" height="64" fill="#000088" />

  <!-- Top-Left Blue Matrix Grid -->
  <g fill="#FFFFFF" stroke="#000044" stroke-width="1">
    <rect x="2" y="2" width="5" height="5" fill="#0000AA" />
    <rect x="3" y="3" width="3" height="3" stroke="none" />
    <rect x="8" y="2" width="5" height="5" fill="#0000AA" />
    <rect x="9" y="3" width="3" height="3" stroke="none" />
    <rect x="14" y="2" width="5" height="5" fill="#0000AA" />
    <rect x="15" y="3" width="3" height="3" stroke="none" />

    <rect x="2" y="8" width="5" height="5" fill="#0000AA" />
    <rect x="3" y="9" width="3" height="3" stroke="none" />
    <rect x="8" y="8" width="5" height="5" fill="#0000AA" />
    <rect x="9" y="9" width="3" height="3" stroke="none" />

    <rect x="2" y="14" width="5" height="5" fill="#0000AA" />
    <rect x="3" y="15" width="3" height="3" stroke="none" />
  </g>

  <!-- Bottom-Right Blue Matrix Grid -->
  <g fill="#FFFFFF" stroke="#000044" stroke-width="1">
    <rect x="57" y="57" width="5" height="5" fill="#0000AA" />
    <rect x="58" y="58" width="3" height="3" stroke="none" />
    <rect x="51" y="57" width="5" height="5" fill="#0000AA" />
    <rect x="52" y="58" width="3" height="3" stroke="none" />
    <rect x="45" y="57" width="5" height="5" fill="#0000AA" />
    <rect x="46" y="58" width="3" height="3" stroke="none" />

    <rect x="57" y="51" width="5" height="5" fill="#0000AA" />
    <rect x="58" y="52" width="3" height="3" stroke="none" />
    <rect x="51" y="51" width="5" height="5" fill="#0000AA" />
    <rect x="52" y="52" width="3" height="3" stroke="none" />

    <rect x="57" y="45" width="5" height="5" fill="#0000AA" />
    <rect x="58" y="46" width="3" height="3" stroke="none" />
  </g>

  <!-- Diagonal Orange-Red Field -->
  <polygon points="0,22 42,0 64,0 64,42 22,64 0,64" fill="url(#tcRedGrad)" />

  <!-- Diagonal Rails -->
  <line x1="0" y1="22" x2="42" y2="0" stroke="#FFE600" stroke-width="2.5" />
  <line x1="0" y1="23" x2="43" y2="0" stroke="#885500" stroke-width="1" />
  <line x1="22" y1="64" x2="64" y2="42" stroke="#FFE600" stroke-width="2.5" />
  <line x1="21" y1="64" x2="64" y2="41" stroke="#885500" stroke-width="1" />

  <!-- 3D "C++" Black Drop Shadow -->
  <g fill="#000000">
    <path d="M 23 18 C 14 18 10 24 10 33 C 10 43 14 50 24 50 C 30 50 34 46 35 43 L 30 39 C 29 42 27 44 23 44 C 18 44 16 39 16 33 C 16 27 18 24 23 24 C 27 24 29 26 30 29 L 35 25 C 33 21 29 18 23 18 Z" transform="translate(2.5, 2.5)" />
    <rect x="36" y="15" width="4" height="12" rx="0.5" transform="translate(2.5, 2.5)" />
    <rect x="32" y="19" width="12" height="4" rx="0.5" transform="translate(2.5, 2.5)" />
    <rect x="49" y="24" width="4" height="12" rx="0.5" transform="translate(2.5, 2.5)" />
    <rect x="45" y="28" width="12" height="4" rx="0.5" transform="translate(2.5, 2.5)" />
  </g>

  <!-- 3D Dark Teal Bevel -->
  <g fill="#006666">
    <path d="M 23 18 C 14 18 10 24 10 33 C 10 43 14 50 24 50 C 30 50 34 46 35 43 L 30 39 C 29 42 27 44 23 44 C 18 44 16 39 16 33 C 16 27 18 24 23 24 C 27 24 29 26 30 29 L 35 25 C 33 21 29 18 23 18 Z" transform="translate(1, 1)" />
    <rect x="37" y="16" width="4" height="12" />
    <rect x="33" y="20" width="12" height="4" />
    <rect x="50" y="25" width="4" height="12" />
    <rect x="46" y="29" width="12" height="4" />
  </g>

  <!-- Cyan Foreground -->
  <g fill="url(#tcCyanGrad)">
    <path d="M 23 18 C 14 18 10 24 10 33 C 10 43 14 50 24 50 C 30 50 34 46 35 43 L 30 39 C 29 42 27 44 23 44 C 18 44 16 39 16 33 C 16 27 18 24 23 24 C 27 24 29 26 30 29 L 35 25 C 33 21 29 18 23 18 Z" />
    <rect x="36" y="15" width="4" height="12" />
    <rect x="32" y="19" width="12" height="4" />
    <rect x="49" y="24" width="4" height="12" />
    <rect x="45" y="28" width="12" height="4" />
  </g>

  <!-- White Highlights -->
  <g stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="square" fill="none">
    <path d="M 12 28 C 12 22 16 19 23 19 C 27 19 31 21 34 24" />
    <line x1="22" y1="24" x2="30" y2="24" />
    <line x1="36" y1="15" x2="40" y2="15" />
    <line x1="32" y1="19" x2="36" y2="19" />
    <line x1="36" y1="15" x2="36" y2="19" />
    <line x1="32" y1="19" x2="32" y2="23" />
    <line x1="49" y1="24" x2="53" y2="24" />
    <line x1="45" y1="28" x2="49" y2="28" />
    <line x1="49" y1="24" x2="49" y2="28" />
    <line x1="45" y1="28" x2="45" y2="32" />
  </g>

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="63" height="63" fill="none" stroke="#000000" stroke-width="1" />
</svg>
